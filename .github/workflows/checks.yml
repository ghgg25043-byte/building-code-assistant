name: Code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Developer retrieval regression
        run: python evaluate.py
      - name: Frontend syntax
        run: node --check static/app.js
      - name: Frontend smoke tests
        run: node tests/frontend_smoke.js
      - name: GitHub Pages dataset sync
        run: python scripts/build_pages_demo.py --check
      - name: GitHub Pages interactive demo
        run: node tests/pages_demo.js
      - name: Local documentation links
        run: python scripts/check_links.py
